# XcodeGen spec. CI runs `xcodegen` to produce FreeRope.xcodeproj (see .github/workflows/ios.yml).
# The app is a native shell around the web app in ../app, with Bluetooth done natively in Swift.
name: FreeRope
options:
  bundleIdPrefix: com.ramon
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.5"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FreeRope:
    type: application
    platform: iOS
    sources:
      - path: FreeRope
      - path: ../app
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ramon.freerope
        PRODUCT_NAME: FreeRope
        INFOPLIST_FILE: FreeRope/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
